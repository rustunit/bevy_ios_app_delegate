[package]
name = "bevy_ios_app_delegate"
version = "0.7.0"
edition = "2024"
license = "MIT"
documentation = "https://docs.rs/bevy_ios_app_delegate"
repository = "https://github.com/rustunit/bevy_ios_app_delegate"
keywords = ["bevy", "gamedev", "mobile", "ios", "objc"]
description = "Bevy Plugin to receive iOS AppDelegate callbacks"

[dependencies]
bevy_app = { version = "0.20", default-features = false }
bevy_channel_trigger = "0.8"
bevy_ecs = { version = "0.20", default-features = false }
bevy_log = { version = "0.20", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
# `block2` carries the restoration-handler argument of
# `application:continueUserActivity:restorationHandler:` and is not a default feature.
objc2-ui-kit = { version = "0.3.1", features = ["block2"] }
